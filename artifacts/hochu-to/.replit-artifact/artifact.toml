kind = "web"
previewPath = "/"
title = "Хочу_То — Маркетплейс аренды"
version = "1.0.0"
id = "artifacts/hochu-to"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21418

[services.development]
run = "pnpm --filter @workspace/hochu-to run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hochu-to", "run", "build" ]
publicDir = "artifacts/hochu-to/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21418"
BASE_PATH = "/"
