openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Хочу_То — Rental Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: listings
    description: Listing/item operations
  - name: bookings
    description: Booking operations
  - name: users
    description: User profile operations
  - name: categories
    description: Category operations
  - name: regions
    description: Region operations
  - name: reviews
    description: Review operations
  - name: joint-purchases
    description: Joint purchase operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /regions:
    get:
      operationId: getRegions
      tags: [regions]
      summary: Get list of regions
      responses:
        "200":
          description: List of regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Region"

  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: Get listing categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: Get listings with filters
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order (new, popular, rating, price_asc, price_desc)
          schema:
            type: string
            enum: [new, popular, rating, price_asc, price_desc]
            default: new
        - name: safeOnly
          in: query
          description: Если "true" — только объявления с включённой защитой сделки
          schema:
            type: string
            enum: ["true", "false"]
        - name: quality
          in: query
          description: Если "true" — порог качества (есть ≥1 фото и описание ≥50 символов). Используется в маркетинговой карусели «Новинки» на главной.
          schema:
            type: string
            enum: ["true", "false"]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Listings list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingsResponse"
    post:
      operationId: createListing
      tags: [listings]
      summary: Create new listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /listings/{id}:
    get:
      operationId: getListingById
      tags: [listings]
      summary: Get listing details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateListing
      tags: [listings]
      summary: Update listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
      responses:
        "200":
          description: Listing updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /listings/{id}/unavailable-dates:
    get:
      operationId: getListingUnavailableDates
      tags: [listings]
      summary: Get unavailable dates for a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unavailable date ranges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DateRange"

  /bookings:
    get:
      operationId: getMyBookings
      tags: [bookings]
      summary: Get current user bookings
      responses:
        "200":
          description: User bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Dates unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}:
    get:
      operationId: getBookingById
      tags: [bookings]
      summary: Get booking details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    put:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update booking status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingStatusRequest"
      responses:
        "200":
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /users/{id}:
    get:
      operationId: getUserById
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateUserProfile
      tags: [users]
      summary: Update user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/listings:
    get:
      operationId: getUserListings
      tags: [users]
      summary: Get user's own listings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"

  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Create a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /listings/{id}/reviews:
    get:
      operationId: getListingReviews
      tags: [reviews]
      summary: Get reviews for a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /joint-purchases:
    get:
      operationId: getJointPurchases
      tags: [joint-purchases]
      summary: Get joint purchase requests
      responses:
        "200":
          description: Joint purchases list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JointPurchase"
    post:
      operationId: createJointPurchase
      tags: [joint-purchases]
      summary: Submit joint purchase request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJointPurchaseRequest"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JointPurchase"

  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [health]
      summary: Subscribe to newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscribeRequest"
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /contact:
    post:
      operationId: submitContactForm
      tags: [health]
      summary: Submit contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactFormRequest"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /settings:
    get:
      operationId: getPublicSettings
      tags: [health]
      summary: Get public platform economy settings
      responses:
        "200":
          description: Public settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPlatformSettings"

  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get full platform settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
    put:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update platform settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSettingsPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"

  /me/finance:
    get:
      operationId: getMyFinance
      tags: [finance]
      summary: Личный финансовый журнал пользователя (derived ledger)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserFinanceResponse"

  /admin/finance:
    get:
      operationId: getAdminFinance
      tags: [admin, finance]
      summary: Сводка денежных потоков платформы
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [today, week, month, all]
            default: month
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFinanceResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PublicPlatformSettings:
      type: object
      properties:
        serviceFeePercent: { type: number }
        taxFeePercent: { type: number }
        shieldFeePercent: { type: number }
        shieldFeeMin: { type: integer }
        riskCoveragePercent: { type: number }
        riskCoverageMin: { type: integer }
        depositMultiplier: { type: number }
        depositMin: { type: integer }
        protMultElectronics: { type: integer }
        protMultTools: { type: integer }
        protMultLeisure: { type: integer }
        protMultSpecialMachinery: { type: integer }
        newUserProtectionCap: { type: integer }
        newUserDealsThreshold: { type: integer }
        jointPurchaseFeePercent: { type: number }
        paymentMode: { type: string }
        yookassaEnabled: { type: boolean }
        sbpEnabled: { type: boolean }
        cloudpaymentsEnabled: { type: boolean }

    PlatformSettings:
      type: object
      properties:
        id: { type: integer }
        serviceFeePercent: { type: string }
        taxFeePercent: { type: string }
        shieldFeePercent: { type: string }
        shieldFeeMin: { type: integer }
        riskCoveragePercent: { type: string }
        riskCoverageMin: { type: integer }
        depositMultiplier: { type: string }
        depositMin: { type: integer }
        protMultElectronics: { type: integer }
        protMultTools: { type: integer }
        protMultLeisure: { type: integer }
        protMultSpecialMachinery: { type: integer }
        newUserProtectionCap: { type: integer }
        newUserDealsThreshold: { type: integer }
        vipPrice7d: { type: integer }
        vipPrice14d: { type: integer }
        vipPrice30d: { type: integer }
        urgentPrice3d: { type: integer }
        urgentPrice7d: { type: integer }
        boostPrice24h: { type: integer }
        subscriptionProMonthly: { type: integer }
        subscriptionBusinessMonthly: { type: integer }
        subscriptionBusinessCommissionPercent: { type: string }
        jointPurchaseFeePercent: { type: string }
        paymentMode: { type: string }
        yookassaEnabled: { type: boolean }
        yookassaShopId: { type: string, nullable: true }
        yookassaTestMode: { type: boolean }
        sbpEnabled: { type: boolean }
        sbpMerchantId: { type: string, nullable: true }
        cloudpaymentsEnabled: { type: boolean }
        cloudpaymentsPublicId: { type: string, nullable: true }
        updatedAt: { type: string }
        updatedBy: { type: integer, nullable: true }

    PlatformSettingsPatch:
      type: object
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [renter, owner]
        phone:
          type: string
        regionId:
          type: integer
      required:
        - name
        - email
        - password
        - role

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [renter, owner, admin]
        phone:
          type: string
        avatar:
          type: string
        bio:
          type: string
        telegram:
          type: string
        website:
          type: string
        regionId:
          type: integer
        regionName:
          type: string
        isVerified:
          type: boolean
          description: Проверенный владелец (бинарный бейдж, ручная верификация админом)
        verifiedAt:
          type: string
          description: Когда был верифицирован (ISO timestamp)
        isBanned:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - role
        - createdAt

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        avatar:
          type: string
        role:
          type: string
        bio:
          type: string
        regionName:
          type: string
        createdAt:
          type: string
        totalListings:
          type: integer
        totalBookings:
          type: integer
        completedDeals:
          type: integer
        rating:
          type: number
        isVerified:
          type: boolean
          description: Проверенный владелец
        verifiedAt:
          type: string
      required:
        - id
        - name
        - role
        - createdAt
        - totalListings
        - totalBookings

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        avatar:
          type: string
        bio:
          type: string
        telegram:
          type: string
        website:
          type: string
        regionId:
          type: integer
        role:
          type: string
          enum: [renter, owner]

    AppNotification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
        title:
          type: string
        message:
          type: string
        bookingId:
          type: integer
        listingTitle:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - userId
        - type
        - title
        - isRead
        - createdAt

    Region:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        listingCount:
          type: integer
      required:
        - id
        - name
        - slug
        - icon

    Listing:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        pricePerDay:
          type: number
        categoryId:
          type: integer
        categoryName:
          type: string
        regionId:
          type: integer
        regionName:
          type: string
        photos:
          type: array
          items:
            type: string
        ownerId:
          type: integer
        ownerName:
          type: string
        ownerAvatar:
          type: string
        ownerPhone:
          type: string
        ownerIsVerified:
          type: boolean
          description: Владелец прошёл верификацию (для бейджа «Проверенный владелец»)
        rating:
          type: number
        reviewCount:
          type: integer
        isAvailable:
          type: boolean
        deposit:
          type: number
        createdAt:
          type: string
      required:
        - id
        - title
        - pricePerDay
        - categoryId
        - regionId
        - ownerId
        - isAvailable
        - createdAt

    ListingDetail:
      allOf:
        - $ref: "#/components/schemas/Listing"
        - type: object
          properties:
            reviews:
              type: array
              items:
                $ref: "#/components/schemas/Review"
            ownerPhone:
              type: string

    ListingsResponse:
      type: object
      properties:
        listings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
        otherRegionsListings:
          type: array
          description: Объявления из других регионов (показываются, когда в выбранном регионе ничего не найдено)
          items:
            $ref: "#/components/schemas/Listing"
      required:
        - listings
        - total
        - page
        - totalPages

    CreateListingRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        pricePerDay:
          type: number
        categoryId:
          type: integer
        regionId:
          type: integer
        city:
          type: string
        lat:
          type: number
        lng:
          type: number
        meetingAddress:
          type: string
        itemCategory:
          type: string
          enum: ["", electronics, tools, leisure, special_machinery]
        ownerProtectionEnabled:
          type: boolean
        photos:
          type: array
          items:
            type: string
        deposit:
          type: number
        isAvailable:
          type: boolean
      required:
        - title
        - pricePerDay
        - categoryId
        - regionId

    DateRange:
      type: object
      properties:
        startDate:
          type: string
        endDate:
          type: string
        status:
          type: string
          enum: [pending, confirmed]
      required:
        - startDate
        - endDate

    CreateBookingRequest:
      type: object
      properties:
        listingId:
          type: integer
        startDate:
          type: string
        endDate:
          type: string
        message:
          type: string
        protectionEnabled:
          type: boolean
          description: Если false — режим «Прямой расчёт» (платная выдача контактов владельца).
        renterProtectionEnabled:
          type: boolean
          description: Арендатор подключает Гарантийный фонд для своей стороны сделки.
      required:
        - listingId
        - startDate
        - endDate

    UpdateBookingStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, rejected, completed, cancelled]
      required:
        - status

    Booking:
      type: object
      properties:
        id:
          type: integer
        listingId:
          type: integer
        listingTitle:
          type: string
        listingPhoto:
          type: string
        renterId:
          type: integer
        renterName:
          type: string
        ownerId:
          type: integer
        ownerName:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        totalDays:
          type: integer
        totalPrice:
          type: number
        rentAmount:
          type: number
          description: Сумма аренды без комиссий (что фактически получает владелец в Free-сделке).
        ownerPayout:
          type: number
          description: Выплата владельцу после удержания комиссий (для защищённых сделок).
        protectionEnabled:
          type: boolean
          description: Защита (эскроу/фонд) включена. Для прямого контактного расчёта — false.
        listingDeposit:
          type: number
          description: Залог по объявлению.
        status:
          type: string
          enum: [pending, confirmed, rejected, completed, cancelled]
        message:
          type: string
        ownerPhone:
          type: string
        createdAt:
          type: string
