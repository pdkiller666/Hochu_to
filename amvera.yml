meta:
  environment: node
  toolchain:
    name: npm
    version: "20"
build:
  # Мы добавляем лимиты для pnpm, чтобы он не ел всю память
  additionalCommands: "export PORT=3000 && npm install -g pnpm@9 && pnpm install --no-frozen-lockfile --child-concurrency=1 && npm run build"
  artifacts:
    "artifacts/api-server/dist": "dist"
run:
  # Используем команду напрямую, чтобы точно знать, что запускается
  command: "node dist/main.js"