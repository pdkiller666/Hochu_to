meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"
build:
  # Ставим pnpm глобально и запускаем сборку всех пакетов
  additionalCommands: "npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm run build"
  artifacts:
    "dist": "dist"
run:
  # Пробуем запустить из корня, если билд создаст там папку dist
  command: "npx serve -s dist"