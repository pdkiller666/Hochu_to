meta:
  environment: node
  toolchain:
    name: npm
    version: "20"
build:
  # 1. Ставим pnpm
  # 2. Ставим зависимости (ограничиваем воркеры)
  # 3. Собираем api-server
  additionalCommands: "npm install -g pnpm@9 && pnpm install --no-frozen-lockfile --child-concurrency=1 && npx pnpm --filter @workspace/api-server build"
  artifacts:
    # Берем содержимое собранной папки сервера и кладем в корень контейнера
    "artifacts/api-server/dist": "."
run:
  # Запускаем именно тот файл, который мы видим на скриншоте
  command: "node --enable-source-maps index.mjs"