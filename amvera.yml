meta:
  environment: node
  toolchain:
    name: npm
    version: "20"
build:
  additionalCommands: "npm install -g pnpm@9 && pnpm install --no-frozen-lockfile --child-concurrency=1 && npx pnpm --filter @workspace/api-server build"
  # Сохраняем всё дерево проекта, чтобы pnpm мог работать
  artifacts:
    ".": "."
run:
  # Запускаем через pnpm напрямую из нужного фильтра
  command: "npx pnpm --filter @workspace/api-server start"