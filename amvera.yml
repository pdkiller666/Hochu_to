meta:
  environment: node
  toolchain:
    name: npm
    version: 20

build:
  # Удаляем поле 'command', чтобы не было ошибки "unknown fields"
  # Amvera автоматически выполнит 'npm run build' из корневого package.json

run:
  # Если 'command' тут тоже вызовет ошибку, Amvera будет искать 'npm start'
  scriptName: start 
  persistence:
    - mountPath: /data
      name: data