meta:
  environment: node
  toolchain:
    name: pnpm
    version: 9.15.9

build:
  # Собираем только api-server и его зависимости, игнорируя sandbox
  command: pnpm install && pnpm --filter @workspace/api-server build

run:
  command: pnpm --filter @workspace/api-server start
  persistence:
    - mountPath: /data
      name: data