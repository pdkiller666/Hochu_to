meta:
  environment: node
  toolchain:
    name: npm
    version: 20

build:
  # Устанавливаем pnpm локально и собираем ТОЛЬКО api-server
  # Переменная PORT нужна, чтобы Vite не ругался при сканировании воркспейса
  command: npm install pnpm && export PORT=3000 && npx pnpm install && npx pnpm --filter @workspace/api-server build

run:
  command: npx pnpm --filter @workspace/api-server start
  persistence:
    - mountPath: /data
      name: data