meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"
build:
  # Мы принудительно ставим pnpm и используем только его
  additionalCommands: "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm run build"
  artifacts:
    "dist": "dist"
run:
  command: "npx serve -s dist"