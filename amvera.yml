meta:
  environment: node
  toolchain:
    name: npm
    version: 20

build:
  # Используем стандартное поле, которое Amvera ждет
  # Она сама выполнит npm install && npm run build
  args: []

run:
  # Указываем имя скрипта из package.json
  scriptName: start
  persistence:
    - mountPath: /data
      name: data